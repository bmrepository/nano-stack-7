[package]
name = "client"
version.workspace = true
edition.workspace = true

[dependencies]
shared-proto = { path = "../shared/proto" }
tokio = { version = "1", features = ["full"] }
snow = "0.9"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Single-instance mutex (CreateMutexW) and, for the status window, bringing an
# already-open window to the foreground (FindWindowW/SetForegroundWindow).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Cross-platform UI stack, per README Section 2's Windows + macOS goal. These
# are the libraries Tauri is built on, used directly rather than via Tauri
# itself: the helper windows embed their own HTML, so a CLI, config files and a
# frontend bundler would all be overhead.
#
# Gated to Windows/macOS deliberately. wry needs WebKitGTK system packages on
# Linux, which would break the Linux compile-check used for fast iteration -
# and a Linux client is an explicit v1 non-goal (README Section 2).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry = "0.56"
tao = "0.36"
tray-icon = "0.24"
rfd = "0.17"

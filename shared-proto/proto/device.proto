syntax = "proto3";
package nano_stack_7;

// Milestone (a): Noise_XX handshake + device cert issuance.

message EnrollmentRequest {
    // The target workspace's ID (a UUID, generated when the workspace was
    // created in the Admin Console) — doubles as the enrollment credential.
    // There's no separate enrollment token by design.
    string workspace_id = 1;
    string hostname = 2;
    string os_version = 3;
    // device_public_key is intentionally omitted: the Noise_XX handshake
    // itself proves the initiator controls the corresponding private key,
    // so the server reads it from the handshake's remote static key rather
    // than trusting a client-supplied value here.
}

message DeviceCertificate {
    string device_id = 1;
    bytes device_public_key = 2;
    string workspace_id = 3;
    int64 issued_at_unix = 4;
    // HMAC-SHA256 over this message with workspace_signature cleared,
    // keyed by the server's identity key (see server/src/workspace.rs's
    // ServerIdentity). A PoC-grade integrity check, not a public-key
    // signature — only the issuing server can verify it. Revisit with a
    // real asymmetric signature (e.g. ed25519) once other parties need to
    // verify a certificate offline.
    bytes workspace_signature = 5;
}

message EnrollmentResponse {
    DeviceCertificate certificate = 1;
}

// Milestone (b): inventory collection + check-in over Noise_IK.

message InstalledApp {
    string name = 1;
    string version = 2;
}

message DeviceInventory {
    string hostname = 1;
    string os_version = 2;
    repeated InstalledApp installed_apps = 3;
    int64 collected_at_unix = 4;
}

message CheckInResponse {
    bool accepted = 1;
    int64 server_time_unix = 2;
    repeated Finding findings = 3;

    // Workspace configuration pushed down on every check-in. The client
    // mirrors these into the [synced] section of its local NS7Conf.toml, so
    // the config it's actually running is inspectable on the device (and so
    // a future standalone mode has the same shape to fall back on).
    string server_version = 4;
    string workspace_name = 5;
    int64 checkin_interval_secs = 6;
    repeated PluginConfig plugins = 7;
}

message PluginConfig {
    string id = 1;
    string name = 2;
    bool enabled = 3;
    // "auto" | "ask" — the consent tier from README Section 6. Config-driven
    // per README Section 10 decision 2, though the Plugin Manager UI that
    // would let an admin change it is still Phase 3 work.
    string consent_tier = 4;
}

// Milestone (c): one hardcoded patch-management finding rule.

message Finding {
    string plugin_id = 1;
    string app_name = 2;
    string installed_version = 3;
    string recommended_version = 4;
    string description = 5;
}

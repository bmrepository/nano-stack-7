# PRODUCTION stack. This is the file Portainer tracks on `main` (LAN server
# at 192.168.0.101) — see README Section 13.
#
# It pulls a prebuilt server image from GHCR rather than building from
# source, so a redeploy is a fast image pull instead of a full Rust + npm
# build on the production host, and prod runs the exact artifact CI built and
# tested. Publish a new image with .github/workflows/publish-server-image.yml
# (automatic on every push to `main`).
#
# For local development, don't edit this file — layer the dev override on
# top, which swaps the image for a local build:
#   podman-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# or just use scripts/dev-stack.ps1, which does that for you.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanostack7
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nanostack7
    ports:
      - "5432:5432"
    # Named volume — this is what makes admin accounts, workspaces and
    # enrolled devices survive a Portainer "pull and redeploy" (which
    # recreates containers but leaves named volumes intact).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Informational only (shows in Portainer's UI). Deliberately NOT used as
    # a `depends_on: condition: service_healthy` gate: podman implements
    # healthchecks via systemd timers, so under rootless podman in WSL2
    # (no systemd) the state never leaves "starting" and the dependent
    # service would wait forever. The server retries its own database
    # connection instead — see server/src/db.rs.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanostack7"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/bmrepository/nano-stack-7-server:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080" # Admin API + React Admin Console
      - "7777:7777" # Device enrollment channel (Noise_XX)
      - "7778:7778" # Device check-in channel (Noise_IK)
    environment:
      DATABASE_URL: postgres://nanostack7:devpassword@postgres:5432/nanostack7
    # Start ordering only — readiness is handled by the server's own
    # connection retry loop (see the healthcheck note above).
    depends_on:
      - postgres

volumes:
  postgres-data:

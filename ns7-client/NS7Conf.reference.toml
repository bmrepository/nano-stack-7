# =============================================================================
# Nano Stack 7 - reference configuration (NS7Conf.toml)
# =============================================================================
#
# This file documents every supported setting, its default, and its allowed
# values. A fresh install writes a working NS7Conf.toml with the defaults
# below; this reference stays alongside it for lookup.
#
# NS7 is standalone-first. Everything here works with NO server: all plugins,
# all policy, all remediation are evaluated on the device against this file.
# Connecting to an NS7 Server Admin Console is OPTIONAL and only changes WHO
# gets to edit parts of this file - never where the configuration lives.
#
# -----------------------------------------------------------------------------
# DESIGN PRINCIPLE: THE DEVICE BELONGS TO THE USER
# -----------------------------------------------------------------------------
# Every default here is chosen to keep the machine fast and uninterrupted while
# the person is using it. The agent should be invisible during the working day.
#
# The important insight is that the expensive part of patch management is not
# *deciding* to patch - it is the scanning, downloading, installing and
# restarting. So the defaults control WHEN that work happens rather than simply
# delaying patches:
#
#   * Scans are infrequent and only run when the machine is genuinely idle.
#   * Heavy work waits for the maintenance window, off active hours.
#   * Nothing runs on battery or a metered connection by default.
#   * The agent runs at below-normal CPU and background I/O priority, so it
#     yields to anything the user is doing.
#   * Deadlines are generous, and enforcement (restarts) is confined to the
#     maintenance window.
#
# One deliberate exception: security updates are still *offered* immediately
# (`deferral_days = 0`). Delaying the availability of a security fix trades
# real risk for no performance gain, because the work itself is already
# deferred to idle time. What is relaxed for security updates is the
# *enforcement* deadline, not the availability.
#
# CONFIG AUTHORITY
#   Standalone (StandaloneMode = true): this file is yours entirely.
#   Enrolled  (StandaloneMode = false): the server owns exactly the sections
#   listed in [managed].owned_sections and overwrites them on each check-in.
#   Everything else remains local and is never touched.
#
# CONVENTIONS
#   Durations are days unless the key says otherwise (_secs, _minutes).
#   Times are 24-hour "HH:MM" local time.
#   Every plugin supports `enabled` and `consent`; see [plugins] below.
#
# NOTE ON ENTERPRISE FLEET CONCEPTS
#   This schema is adapted from an Intune/Autopatch-style model. Fleet-level
#   ideas there (Entra group targeting, Conditional Access, tenant-wide ring
#   membership) have no meaning on a single standalone device, so they are not
#   reproduced. Ring membership survives as one local value - `device.ring`.
# =============================================================================


# Operating mode. `true` = fully standalone, no server contact of any kind.
# `false` = enrolled; requires [server] and [workspace] to be filled in.
# Chosen on first run in the app's Agent section, and changeable there later.
StandaloneMode = true


# -----------------------------------------------------------------------------
# [agent] - the daemon itself
# -----------------------------------------------------------------------------
[agent]
# How often plugins evaluate the device. This is the expensive operation -
# enumerating installed software and querying update catalogues - so it is
# deliberately infrequent. Combined with [performance] gating, a scan normally
# lands while the machine is idle and costs the user nothing.
# Values: 3600-86400. Default: 21600 (6 hours).
# Lower only if you need faster detection and accept the cost; 3600 (hourly)
# is the practical floor before scanning becomes noticeable.
scan_interval_secs = 21600

# Only meaningful when enrolled. A check-in is a small network round-trip, not
# a scan, so it can be far more frequent than scanning without costing
# anything measurable. This is what keeps the Admin Console's view current.
# Values: 300-86400. Default: 3600 (1 hour).
checkin_interval_secs = 3600

# Run the first scan this long after login rather than immediately. Boot and
# login are the worst possible moment to add work - the machine is already
# contending for CPU and disk.
# Values: 0-60. Default: 15.
startup_scan_delay_minutes = 15

# Values: "error" | "warn" | "info" | "debug" | "trace". Default: "info".
# "debug" and "trace" write substantially more to disk; avoid leaving them on.
log_level = "info"

# Show the tray icon in the notification area. Default: true.
tray_icon = true

# Check GitHub for newer agent releases. Values: "never" | "notify" | "auto".
# Default: "notify" - the agent should not replace itself mid-workday.
# With "auto", the install still respects [maintenance_window].
self_update = "notify"


# -----------------------------------------------------------------------------
# [performance] - the guard rails that keep the agent out of the way
# -----------------------------------------------------------------------------
# These gate ALL plugin work: scanning, downloading, installing, remediating.
# When a gate is not satisfied, the work is postponed to the next opportunity
# rather than skipped - nothing is lost, it simply waits for a better moment.
[performance]
# Only scan when the machine is idle. This is the single most effective
# setting here: it means a scan essentially never competes with the user.
# Default: true.
scan_only_when_idle = true

# How long without keyboard/mouse input before the device counts as idle.
# Values: 1-120. Default: 10.
idle_threshold_minutes = 10

# Do not start work if sustained CPU is already above this. Prevents the agent
# piling on during a build, a render, or a video call.
# Values: 10-100. Default: 25.
max_cpu_percent_to_start = 25

# Abort in-progress work if the user returns and CPU demand climbs. The work
# resumes at the next opportunity.
# Default: true.
yield_when_user_returns = true

# Windows process priority class for the agent and anything it spawns.
# Values: "idle" | "below_normal" | "normal".
# Default: "below_normal" - the agent should always lose a fight for CPU.
process_priority = "below_normal"

# Background I/O priority, so disk-heavy scanning does not starve foreground
# applications. Values: "low" | "normal". Default: "low".
io_priority = "low"

# Never run on battery. Patch work is a meaningful drain, and a laptop on
# battery is almost always in active use.
# Default: true.
defer_on_battery = true
# Exception: allow work on battery above this charge level, for machines that
# are rarely plugged in. Values: 0-100 (0 disables the exception).
# Default: 0.
battery_override_above_percent = 0

# Never download over a connection Windows reports as metered (tethered
# phone, mobile broadband, capped hotel wifi).
# Default: true.
defer_on_metered_connection = true

# Run one plugin at a time rather than in parallel. Serial execution is slower
# in wall-clock terms but far gentler on a machine someone is using.
# Values: 1-5. Default: 1.
max_concurrent_plugin_scans = 1

# Prefer to schedule scans outside [active_hours] even when the machine is
# idle during the day. Default: true.
prefer_outside_active_hours = true

# Upper bound on how long postponement may continue before the agent runs
# anyway. Without this, a machine that is never idle would never be scanned.
# Values: 1-30. Default: 7.
max_postpone_days = 7


# -----------------------------------------------------------------------------
# [maintenance_window] - when heavy work is allowed
# -----------------------------------------------------------------------------
# Downloads, installs, remediation and restarts happen here. Scanning is
# lighter and is governed by [performance] instead, so detection still happens
# between windows.
[maintenance_window]
# Default: true. With false, work may run at any time the [performance] gates
# allow, which is more responsive but less predictable for the user.
enabled = true

# Values: "daily" | "weekdays" | "weekends" | a list of day names.
# Example: ["tuesday", "thursday", "saturday"]. Default: "daily".
days = "daily"

# The window itself. Defaults sit outside the default active hours
# (06:00-22:00) and cross midnight, which is normal and supported.
# Default: "22:30" to "05:30".
start = "22:30"
end = "05:30"

# If the machine is asleep or off for the whole window, run the work at the
# next opportunity that satisfies [performance] instead of waiting a full day.
# Default: true. Set false for strict change-control environments.
catch_up_if_missed = true

# Wake the machine from sleep to use the window. Default: false - waking a
# laptop in someone's bag to install updates is rarely the right call.
wake_to_run = false


# -----------------------------------------------------------------------------
# [device] - local identity and ring assignment
# -----------------------------------------------------------------------------
[device]
# Deployment ring. Standalone: set it yourself. Enrolled: assigned by the
# server. Rings stagger rollout - lower rings receive updates first and act as
# canaries for the ones behind them.
# Values: "pilot" | "early" | "production" | "excluded". Default: "production".
#   pilot      - receives updates immediately (day 0)
#   early      - typical +3 day delay
#   production - typical +7 day delay
#   excluded   - never auto-updates; findings are reported only
ring = "production"

# Extra delay on top of the ring's own delay, for one-off exceptions
# (a demo machine, a workstation mid-project).
# Values: 0-365. Default: 0.
additional_delay_days = 0

# Free-text label surfaced in the UI and, when enrolled, the Admin Console.
# Default: "" (uses the hostname).
label = ""


# -----------------------------------------------------------------------------
# [active_hours] - when the device must not be disrupted
# -----------------------------------------------------------------------------
# No restart and no interactive install inside these hours, for any plugin.
[active_hours]
# Values: "manual" | "automatic". "automatic" learns from usage patterns and
# suits people with irregular schedules.
# Default: "manual".
mode = "manual"

# Used when mode = "manual". Default: "06:00" to "22:00" - deliberately wide,
# because the cost of guessing too narrow is interrupting someone at work.
# Windows caps the active-hours window at 18 hours.
start = "06:00"
end = "22:00"


# -----------------------------------------------------------------------------
# [notifications] - what the user sees
# -----------------------------------------------------------------------------
[notifications]
# Values: "all" | "failures_only" | "none". Default: "failures_only" -
# routine background patching is not news; a failure is.
level = "failures_only"

# Toast when an update becomes available. Default: false - with work deferred
# to the maintenance window anyway, an availability toast is just noise.
show_available = false

# Warn before a restart. Default: true - this one always matters.
show_restart_warning = true

# Reminder cadence before a deadline. Values: 15 | 30 | 60. Default: 60.
reminder_interval_minutes = 60

# Days before a deadline at which to start warning. Default: 3.
deadline_warning_days = 3


# -----------------------------------------------------------------------------
# [restart] - shared restart policy
# -----------------------------------------------------------------------------
# The most disruptive thing the agent can do, so the defaults are cautious.
# Individual plugins may override these.
[restart]
# Values: "automatic" | "user_controlled". Default: "user_controlled".
behavior = "user_controlled"

# Only restart outside [active_hours]. Default: true.
outside_active_hours_only = true

# Only restart inside [maintenance_window]. Default: true.
inside_maintenance_window_only = true

# Preferred restart slot when one is pending.
# Values: "any" | "monday" ... "sunday". Default: "sunday".
scheduled_day = "sunday"
# Values: "00:00"-"23:59". Default: "03:00" (inside the default window).
scheduled_time = "03:00"

# Warning countdown before a forced restart.
# Values: 5-1440. Default: 120 - two hours is enough to save work and step
# away, without being so long the warning is forgotten.
countdown_minutes = 120

# How many times the user may postpone. Values: 0-5. Default: 5.
max_postponements = 5

# Never restart while these are running; wait for the next window instead.
# Example: ["Teams.exe", "Zoom.exe", "devenv.exe", "ssms.exe"]
# Default: [] - add anything whose sudden death would lose work.
block_restart_if_running = []


# -----------------------------------------------------------------------------
# [delivery_optimization] - bandwidth control
# -----------------------------------------------------------------------------
[delivery_optimization]
# Values: "http_only" | "lan_peering" | "internet_peering" | "lan_and_internet".
# Default: "lan_peering" - peers on the local network, avoiding repeated WAN
# downloads, without exposing the device to internet peering.
download_mode = "lan_peering"

# Peer cache size in GB. Values: 1-100. Default: 10 - halved from a typical
# enterprise value because disk on a personal device is not free.
cache_size_gb = 10

# Bandwidth cap during [active_hours]. Kept low so a background download never
# competes with a video call. Values: 5-100. Default: 20.
max_bandwidth_percent_active = 20

# Bandwidth cap outside active hours / inside the maintenance window, where
# there is nothing to compete with. Values: 10-100. Default: 80.
max_bandwidth_percent_idle = 80


# -----------------------------------------------------------------------------
# [managed] - written by the server; do not hand-edit
# -----------------------------------------------------------------------------
# Only meaningful when StandaloneMode = false. The server overwrites exactly
# the sections named in `owned_sections` on every check-in; everything outside
# that list stays local, so enrolling a device never silently discards its
# existing configuration.
[managed]
# Set to true once enrolled and the server has pushed configuration at least
# once. Default: false.
active = false

# Populated from the last successful check-in. Informational only.
last_sync_unix = 0
server_version = ""
workspace_name = ""

# TOML paths the server currently owns, e.g.
#   ["plugins.windows_security_updates", "restart", "active_hours"]
# Empty means the server pushes nothing and every setting stays local.
# Default: [].
owned_sections = []


# -----------------------------------------------------------------------------
# [server] / [workspace] - only used when StandaloneMode = false
# -----------------------------------------------------------------------------
[server]
# Hostname or IP of the NS7 Server Admin Console. Default: "".
host = ""
# Default: 7777 (Noise_XX enrollment) and 7778 (Noise_IK check-in).
enrollment_port = 7777
checkin_port = 7778

[workspace]
# The workspace's UUID doubles as the enrollment credential; copy it from the
# Admin Console's Workspaces page. Default: "".
id = ""


# =============================================================================
# PLUGINS
# =============================================================================
# Every plugin shares two keys:
#
#   enabled  true | false
#
#   consent  "auto"        act without asking (only for low blast radius)
#            "ask"         prompt the user, act only on approval
#            "notify_only" report the finding, never act
#            "disabled"    do not even evaluate
#            Default: "ask". Section 1 of the README - the human stays in the
#            loop - is why "ask" is the default rather than "auto".
#
# All plugin work is subject to [performance] and [maintenance_window]. A
# deadline below means "the point at which the agent stops waiting for an
# ideal moment", not "the moment it interrupts you" - enforcement still
# prefers the maintenance window.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Microsoft Windows OS Security Updates Management
# -----------------------------------------------------------------------------
# Security-classified OS updates. Kept separate from quality updates because
# they warrant a shorter deadline.
[plugins.windows_security_updates]
enabled = true
consent = "ask"

# Deliberately 0 while everything else here is relaxed. Deferring the
# *availability* of a security fix buys no performance - the install is
# already confined to idle time and the maintenance window - and costs real
# exposure. Raise this only with a specific reason.
# Values: 0-30. Default: 0.
deferral_days = 0

# When the agent stops waiting for a convenient moment. Relaxed from a typical
# enterprise 7 to give more chances for a genuinely idle maintenance window
# before enforcement.
# Values: 0-30. Default: 10.
deadline_days = 10

# Extra time after the deadline before a forced restart, so someone returning
# from leave is not restarted the moment they reconnect.
# Values: 0-7. Default: 3.
grace_period_days = 3

# Restart automatically once deadline + grace has elapsed. Still bound by
# [restart], so it lands in the maintenance window. Default: true.
auto_reboot_after_deadline = true

# Which severities this plugin acts on. Anything excluded is still reported,
# so nothing is hidden - it just does not trigger work.
# Values: any of "critical", "important", "moderate", "low".
# Default: ["critical", "important"] - moderate and low rarely justify the
# install and restart cost.
severity_filter = ["critical", "important"]

# Include updates for other Microsoft products (not just the OS).
# Default: true.
include_microsoft_products = true

# Values: "windows_update" | "wsus". Default: "windows_update".
update_source = "windows_update"
# Example: "http://wsus.corp.example.com:8530". Default: "".
wsus_server = ""

# Emergency stop. While true, nothing is offered or installed.
# Default: false.
paused = false
# Optional auto-resume date, "YYYY-MM-DD". Default: "" (paused until cleared).
paused_until = ""


# -----------------------------------------------------------------------------
# 2. Microsoft Windows OS Quality Updates Management
# -----------------------------------------------------------------------------
# Monthly cumulative (non-security) updates. Longer deferrals are appropriate:
# these carry more regression risk, less urgency, and are usually the largest
# downloads.
[plugins.windows_quality_updates]
enabled = true
consent = "ask"

# Also lets early adopters surface problems before this device takes them.
# Values: 0-30. Default: 14.
deferral_days = 14

# Values: 0-30. Default: 21.
deadline_days = 21

# Values: 0-7. Default: 3.
grace_period_days = 3

# Default: true.
auto_reboot_after_deadline = true

# Install without individual approval once the deferral has elapsed.
# Default: true. Set false to require explicit approval per update.
automatic_approval = true

# Include hardware driver updates delivered through Windows Update.
# Default: false - drivers are the most common source of regressions and of
# post-update performance problems, so they are opt-in and notify-only.
include_drivers = false
# Values: "auto" | "ask" | "notify_only". Default: "notify_only".
driver_consent = "notify_only"
# Driver classes never installed automatically, regardless of the above.
# Values: any of "gpu", "bios", "firmware", "storage", "network", "audio".
# Default: ["gpu", "bios", "firmware", "storage"].
driver_manual_approval_classes = ["gpu", "bios", "firmware", "storage"]

# Values: "windows_update" | "wsus". Default: "windows_update".
update_source = "windows_update"

# Default: false.
paused = false
paused_until = ""


# -----------------------------------------------------------------------------
# 3. Microsoft 365 Apps (Office) for PC
# -----------------------------------------------------------------------------
# Click-to-Run updates for the Microsoft 365 desktop apps.
[plugins.microsoft_365_apps]
enabled = true
consent = "ask"

# Release channel. Slower channels trade features for stability, and update
# less often - which is also less background work.
# Values:
#   "current"                  newest features, fastest cadence
#   "monthly_enterprise"       monthly, predictable - recommended default
#   "semi_annual"              twice yearly, most stable, least churn
#   "semi_annual_preview"      semi-annual, one cycle early
#   "current_preview"          current channel, pre-release
#   "beta"                     unsupported, test devices only
# Default: "monthly_enterprise".
update_channel = "monthly_enterprise"

# Pin to a specific build, e.g. "16.0.17328.20162". Empty = always latest for
# the channel. Default: "".
target_version = ""

# Values: 0-30. Default: 14.
deadline_days = 14

# Keep the previous build available so a bad release can be rolled back.
# Costs disk; worth it. Default: true.
rollback_enabled = true

# Suppress Office's own update prompts, so NS7 is the single voice.
# Default: true.
hide_update_notifications = true

# Close Office apps automatically to apply an update once past the deadline.
# Default: false - closing apps under someone mid-document is exactly the kind
# of interruption these defaults exist to avoid. NS7 waits for them to close.
force_app_shutdown = false

# Default: false.
paused = false
paused_until = ""


# -----------------------------------------------------------------------------
# 4. Microsoft Store Apps (WinGet)
# -----------------------------------------------------------------------------
# Public applications from the Store / WinGet catalog: browsers, readers,
# utilities. Low blast radius and no restarts, so this is the one plugin where
# unattended updates are the sensible default.
[plugins.store_apps]
enabled = true
# Safe to run unattended - still gated by [performance] and the maintenance
# window, so it happens while the machine is idle. Default: "auto".
consent = "auto"

# Where packages come from.
# Values: "msstore" | "winget" | "both". Default: "both".
update_source = "both"

# Values: "system" | "user". Default: "system" - keeps apps consistent for
# every account and avoids re-running per user.
installation_context = "system"

# May the signed-in user update or remove managed apps themselves?
# Values: "allowed" | "blocked". Default: "allowed" in standalone.
user_update_control = "allowed"

# Update everything found, or only `include` below.
# Default: true.
update_all = true

# Package IDs to manage when update_all = false.
# Example: ["Google.Chrome", "7zip.7zip", "Notepad++.Notepad++"]
# Default: [].
include = []

# Never touched, even when update_all = true. Worth listing anything whose
# update is large, slow, or disruptive mid-session.
# Example: ["Valve.Steam", "Docker.DockerDesktop"]
# Default: [].
exclude = []

# Hold specific packages at a version, e.g.
#   [{ id = "Google.Chrome", version = "131.0.6778.86" }]
# Default: [].
pinned = []

# Delay after a new version appears before this device takes it. Stacks with
# device.ring. Values: 0-90. Default: 3 - lets obviously-broken releases be
# pulled before this device spends bandwidth on them.
delay_days = 3

# Cap on how many app updates to install in a single window, so one session
# cannot turn into an hour of churn. Values: 1-50. Default: 10.
max_updates_per_window = 10

# Per-application overrides. Anything omitted falls back to the values above.
# [[plugins.store_apps.applications]]
# id            = "Google.Chrome"
# consent       = "auto"
# delay_days    = 1
# deadline_days = 7


# -----------------------------------------------------------------------------
# 5. Microsoft Win32 Native Apps
# -----------------------------------------------------------------------------
# Line-of-business and packaged desktop applications: VPN clients, security
# agents, ERP, in-house software. The most control and the most configuration,
# because NS7 cannot infer install/detect semantics as it can for WinGet.
[plugins.win32_apps]
enabled = false
consent = "ask"

# ---- Defaults applied to every application below unless it overrides them --

# Values: "system" | "user". Default: "system".
installation_context = "system"

# Values: "x86" | "x64" | "arm64". Default: "x64".
architecture = "x64"

# Values: "app_defined" | "force" | "suppress". Default: "suppress" -
# an application installer should not get to reboot the machine on its own.
restart_behavior = "suppress"

# Abandon an install that runs longer than this. Generous, because a slow
# install at 03:00 costs nothing, whereas a retry loop does.
# Values: 5-120. Default: 60.
install_timeout_minutes = 60

# Exit codes treated as success. 3010 and 1641 mean "succeeded, reboot needed"
# and must not be read as failures.
# Default: [0, 3010, 1641].
success_return_codes = [0, 3010, 1641]
# Exit codes worth retrying rather than failing outright. Default: [1618].
# (1618 = another install is already in progress.)
retry_return_codes = [1618]
# Values: 0-5. Default: 2.
max_retries = 2
# Wait this long before retrying, rather than hammering immediately.
# Values: 1-1440. Default: 60.
retry_delay_minutes = 60

# Values: "show_all" | "failures_only" | "hide_all". Default: "failures_only".
user_notifications = "failures_only"

# Values: 0-30. Default: 14. Security tooling typically overrides this to 1-2
# per application.
deadline_days = 14

# What to do when a required app is found missing, wrong-versioned or broken.
# Values: any of "reinstall", "upgrade", "repair", "restore", "retry".
# Default: ["upgrade", "repair", "retry"] - deliberately excludes "reinstall"
# and "restore", which can destroy local state.
remediation_actions = ["upgrade", "repair", "retry"]

# ---- Per-application definitions -------------------------------------------
# One [[plugins.win32_apps.applications]] block per managed application.
# Nothing is managed until at least one is defined - hence enabled = false.
#
# [[plugins.win32_apps.applications]]
# name              = "Contoso VPN Client"
# version           = "5.2.1"
# # Values: "required" | "available" | "uninstall".
# assignment        = "required"
# install_command   = "setup.exe /silent /norestart"
# uninstall_command = "MsiExec.exe /X{GUID} /quiet"
# repair_command    = ""                      # optional
# source            = "https://files.example.com/vpn-5.2.1.zip"
# sha256            = "..."                   # verified before executing
#
# # How NS7 decides the app is present and current. Checked in order; the
# # first that matches wins. MSI and registry are cheapest and most reliable -
# # a script detection spawns PowerShell on every scan, so prefer the others.
# # Types: "msi_product_code" | "registry" | "file_version" | "script".
# [[plugins.win32_apps.applications.detection]]
# type            = "msi_product_code"
# product_code    = "{12345678-1234-1234-1234-1234567890AB}"
#
# [[plugins.win32_apps.applications.detection]]
# type            = "registry"
# path            = 'HKLM\Software\Contoso\VPN'
# value           = "Version"
# # Values: "equals" | "greater_or_equal" | "exists" | "version_greater_or_equal".
# operator        = "version_greater_or_equal"
# expected        = "5.2.1"
#
# # Must be satisfied or the app is skipped (and reported as not applicable).
# [plugins.win32_apps.applications.requirements]
# min_os_version  = "10.0.22000"     # Windows 11 21H2
# architecture    = ["x64"]
# min_ram_gb      = 8
# min_disk_gb     = 2
#
# # Installed first, in the order listed.
# [[plugins.win32_apps.applications.dependencies]]
# name            = ".NET Desktop Runtime 8"
# winget_id       = "Microsoft.DotNet.DesktopRuntime.8"
# auto_install    = true
#
# # Replaces an older application.
# [plugins.win32_apps.applications.supersedes]
# name                = "Contoso VPN Client 4.x"
# uninstall_previous  = true


# =============================================================================
# TUNING THE DEFAULTS
# =============================================================================
# To make the agent more responsive at the cost of some interruption:
#   agent.scan_interval_secs        21600 -> 7200
#   performance.scan_only_when_idle true  -> false
#   maintenance_window.enabled      true  -> false
#   plugins.*.deadline_days         reduce
#
# To make it even less intrusive (shared, low-powered or battery-bound
# machines):
#   agent.scan_interval_secs                43200 (12h)
#   performance.idle_threshold_minutes      30
#   performance.max_cpu_percent_to_start    15
#   maintenance_window.days                 "weekends"
#   plugins.store_apps.max_updates_per_window 5
#
# The one setting worth leaving alone is
# plugins.windows_security_updates.deferral_days. Everything else here delays
# *work*; that setting delays *protection*.
# =============================================================================


# =============================================================================
# PLANNED PLUGINS (schema not final; not yet evaluated by the agent)
# =============================================================================
#   windows_feature_updates - OS version upgrades (e.g. Windows 11 24H2 -> 25H2)
#     target_version, deferral_days (0-365, typically 60-90),
#     rollback_period_days (2-60), compatibility_hold, manual_approval
#
#   windows_driver_updates - standalone driver management, beyond the
#     include_drivers switch under windows_quality_updates
#     approval_mode ("all" | "recommended_only" | "manual"),
#     excluded_models, per-class approval

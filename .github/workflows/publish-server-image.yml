# Builds the NS7 server image (Rust API + React Admin Console) and pushes it
# to GHCR, so the production stack can pull a prebuilt artifact instead of
# compiling on the production host.
#
# Runs on every push to `main`, which is the branch Portainer tracks — so the
# normal release flow is: merge dev → main, wait for this workflow, then hit
# "pull and redeploy" in Portainer.
#
# Tags published:
#   :latest        — moving tag, what the prod compose file references
#   :<short-sha>   — immutable, for rolling back to a specific build
#   :<git-tag>     — when triggered by a v* tag push
name: Publish server image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the automatic GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Must be lowercase — GHCR rejects uppercase image names.
          images: ghcr.io/bmrepository/nano-stack-7-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

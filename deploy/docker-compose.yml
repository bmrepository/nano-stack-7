services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nanostack7
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nanostack7
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8080:8080" # Admin API + React Admin Console
      - "7777:7777" # Device enrollment channel (Noise_XX)
      - "7778:7778" # Device check-in channel (Noise_IK)
    environment:
      WORKSPACE_ENROLLMENT_TOKEN: dev-enrollment-token
    depends_on:
      - postgres

volumes:
  postgres-data:

# Builds the Windows NS7 client installer (MSI) and publishes it as a
# GitHub Release. Runs on GitHub's windows-latest runner specifically so
# the MSVC toolchain and WiX Toolset v3 (both preinstalled on that image)
# don't need to be provisioned anywhere else — no dependency on lab1 or any
# other machine to cut a release.
#
# If a run fails, download the job log from the Actions UI and read the
# actual error — three rounds of guessing at WiX path behavior from step
# timings alone got nowhere, while the first look at real `light.exe`
# output pinpointed it immediately.
name: Release client installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Chocolatey is preinstalled on windows-latest and doesn't depend on
      # any GitHub API call — arduino/setup-protoc@v3 failed here on the
      # first real run, most likely GitHub's well-known unauthenticated
      # rate-limit gotcha with that action (it queries GitHub's API for
      # protobuf releases without a repo-token by default).
      - name: Install protoc
        run: choco install protoc -y

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wix
        run: cargo install cargo-wix

      # Build explicitly first so target/release exists for the icon staging
      # below. `cargo wix` re-runs the build itself, but that's an
      # incremental no-op by then.
      - name: Build client binaries
        run: cargo build --release -p client

      # light.exe resolves <File Source=...> against its own working
      # directory, not the .wxs file's location — relative paths from
      # client/wix/ failed repeatedly with LGHT0103. Staging the icons
      # alongside the binaries lets main.wxs reference them via
      # $(var.CargoTargetBinDir), the one path form confirmed to work here.
      - name: Stage tray icons next to the built binaries
        run: Copy-Item client\assets\ns7-icon-*.ico target\release\

      - name: Build MSI installer
        run: cargo wix -p client --nocapture --output nano-stack-7-client-installer.msi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nano-stack-7-client-installer.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
